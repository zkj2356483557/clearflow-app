<!-- App Store 图标源文件：正方形满幅、无圆角、无透明通道。
     iOS 会自行裁切圆角，所以这里必须画满 96×96（不要预切圆角）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="1024" height="1024" role="img" aria-label="清流记账 App Icon">
  <defs>
    <linearGradient id="bg" x1="6" y1="0" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ecbff" />
      <stop offset="0.44" stop-color="#2f8cf7" />
      <stop offset="1" stop-color="#0847b8" />
    </linearGradient>
    <linearGradient id="gloss" x1="48" y1="0" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="48" cy="33" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="drop" x1="48" y1="20" x2="48" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d8e9ff" />
    </linearGradient>
  </defs>

  <rect width="96" height="96" fill="url(#bg)" />
  <rect width="96" height="58" fill="url(#gloss)" />
  <circle cx="48" cy="33" r="42" fill="url(#glow)" />

  <!-- 水滴 -->
  <path
    d="M48 21c9.5 10.1 16 18 16 26.3A16 16 0 0 1 48 63.3 16 16 0 0 1 32 47.3C32 39 38.5 31.1 48 21Z"
    fill="url(#drop)"
  />

  <!-- 涟漪 -->
  <path
    d="M30.5 71.5c5.8-3.7 11.7-3.7 17.5 0s11.7 3.7 17.5 0"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.9"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
