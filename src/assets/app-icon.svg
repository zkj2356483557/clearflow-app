<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="清流记账 app icon">
  <defs>
    <linearGradient id="bg" x1="18" y1="6" x2="82" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cc4ff" />
      <stop offset="0.46" stop-color="#2f8cf7" />
      <stop offset="1" stop-color="#0a5ed8" />
    </linearGradient>
    <linearGradient id="gloss" x1="48" y1="2" x2="48" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="drop" x1="48" y1="24" x2="48" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dceaff" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="96" height="96" rx="26" fill="url(#bg)" />
  <rect x="0" y="0" width="96" height="52" rx="26" fill="url(#gloss)" />
  <rect x="0" y="30" width="96" height="66" rx="0" fill="none" />

  <!-- water drop -->
  <path
    d="M48 22c9.2 9.8 15.4 17.4 15.4 25.4A15.4 15.4 0 0 1 48 62.8a15.4 15.4 0 0 1-15.4-15.4C32.6 39.4 38.8 31.8 48 22Z"
    fill="url(#drop)"
  />

  <!-- ripple -->
  <path
    d="M31 70c5.6-3.6 11.3-3.6 17 0s11.4 3.6 17 0"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.85"
    stroke-width="5"
    stroke-linecap="round"
  />
